    <meta charset="UTF-8" />

    <meta name="theme-color" content="#7C5C1E" />
    <meta name="color-scheme" content="light" />
    <!-- title／description 是給搜尋引擎看的「這個網址是什麼」，
         og:* 是給 LINE／Facebook 分享卡片看的「點下去會看到什麼」。
         這一份 index.html 同時服務官網首頁（heshengtan.tw/）與法會報名頁，
         而 **canonical 指的是官網首頁**，所以 title 必須是官網的，不能是報名的——
         否則 Google 收錄的官網首頁標題會變成「和聖壇法會線上報名」，
         信眾搜「古亭 媽祖廟」看到的是一場法會的報名頁（2026-09-02 發現並修正）。

         ── 2026-10-01：og:* 也換回官網版 ──
         普渡法會 9/13 已經辦完，og:* 卻還停在報名版：任何人分享 heshengtan.tw，
         LINE／FB 卡片都寫著「法會線上報名⋯國曆9/13舉行」，點下去還落到 /fahui
         的「報名已截止」。**下一次辦法會要再改成報名版時，四個標籤要一起改**：
         og:title、og:description、og:url、以及下面 Twitter Card 那兩個
         （只改 og:* 會讓 X 顯示另一套文案）。 -->
    <title>台北和聖壇｜像家就是家｜問事、點燈與法會服務</title>
    <meta name="description" content="台北市中正區古亭的和聖壇，創立於民國 73 年，主祀天上聖母。提供問事、點燈、法會超薦與神尊參拜，每日開放。捷運古亭站 2 號出口步行約 5 分鐘。" />
    <!-- 網站圖示。全部由 public/logo.png 產生（scripts/build-icons.js），換 logo 時重跑那支就好。
         都鋪了網站底色 #F5F0E8：原始 logo 是紅線稿＋透明背景，深色分頁上會糊在深色裡。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- 96×96 是給 Google 搜尋結果用的：Google 只採用「48 的倍數」的正方形圖示，
         宣告 32x32 會被它略過，搜尋結果就顯示預設的地球圖示（實際踩過）。 -->
    <link rel="icon" type="image/png" href="/icon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://heshengtan.tw/" />
    <link rel="preload" href="/hero-gold.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/hero-sanma.webp" as="image" type="image/webp" />

    <!-- Open Graph（LINE／Facebook 分享預覽） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="台北古亭和聖壇" />
    <meta property="og:title" content="台北和聖壇｜像家就是家｜問事、點燈與法會服務" />
    <meta property="og:description" content="台北市中正區古亭的和聖壇，創立於民國 73 年，主祀天上聖母。提供問事、點燈、法會超薦與神尊參拜，每日開放。捷運古亭站 2 號出口步行約 5 分鐘。" />
    <!-- 分享卡的縮圖：1200×630（LINE／FB 的標準 1.91:1）。
         舊的 fahui-banner.jpg 是 3200×800 的 4:1 橫幅，在 LINE 的卡片裡會被裁掉兩側或留黑邊，
         檔案仍留在 public/ 給報名表頁面內用。這張由 scripts 之外的合成產生，來源是
         public/hero-gold.jpg ＋ 三尊去背圖，版面與網站 Hero 一致。 -->
    <meta property="og:image" content="https://heshengtan.tw/og-hero.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="台北古亭和聖壇" />
    <!-- og:url 是分享卡片點下去要到的地方。法會收件期間這裡是 /fahui（卡片文案也是
         報名版，落在報名表才對）；2026-10-01 法會結束後與 canonical 一致，都回官網首頁。
         （完整緣由寫在 App.tsx 的 OFFICIAL_HOSTS 註解，那份不會送到瀏覽器。） -->
    <meta property="og:url" content="https://heshengtan.tw/" />
    <meta property="og:locale" content="zh_TW" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="台北和聖壇｜像家就是家｜問事、點燈與法會服務" />
    <meta name="twitter:description" content="創立於民國 73 年、主祀天上聖母的古亭宮壇。問事、點燈、法會超薦與神尊參拜，每日開放。" />
    <meta name="twitter:image" content="https://heshengtan.tw/og-hero.jpg" />

         Google 會跑 JS 所以看得到，但 GPTBot／ClaudeBot／PerplexityBot 這類
         AI 檢索器**不執行 JS**，沒有這一段的話它們對本站一無所知。
         事實有變動時記得跟著改（地址、電話、服務項目）。 -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 中文字型每個字重都是一整套字庫，宣告一個沒用到的字重＝白付它在 css2 那份
         @font-face 清單裡的成本（該檔實測 265KB，因為每個字重都要展開上百個 unicode-range）。
         2026-09-10 實測全站渲染（首頁／關於／神尊／點燈／問事／歲時節慶／經文），
         實際用到的只有 Serif 400・700・900 與 Sans 400・500・700；
         **Serif 600 與 Sans 300 一個元素都沒有**，已移除。
         Serif 900 不能砍——/scripture 天上聖母經每個字一個 span，2045 個元素在用。
         另有 12 個元素是 Sans 600（font-semibold 落在無襯線上），瀏覽器合成假粗體；
         為 12 個元素多載一整套字庫不划算，維持現狀。 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
      }
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #F8F5F0;
        overflow-x: clip;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      button, a, [role="button"] { touch-action: manipulation; }
      /* 全域鍵盤焦點樣式移到 index.css：原本這條用金色，在白底只有 2.67:1、
         米底 2.36:1，都低於 WCAG 2.2 對焦點指示的 3:1 要求。
         現在淺色區用褐色（6.16:1）、深色區用金色（5.34:1），分開處理。
         **不要在這裡再加一條全域 :focus-visible**，兩條會互相打架。 */
      img { height: auto; }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Serif TC', serif;
      }
      @media (max-width: 639px) {
        input, select, textarea { font-size: 16px !important; }
      }
      section[id] { scroll-margin-top: 80px; }

      /* ── Hero 場景節奏 ──
         背景的綢緞是持續互動；前景只在首次進場時揭幕，之後保持莊重穩定。
         神像僅隨觀看角度移動數個像素，提供景深而不做漂浮動畫。 */
      .hero-scene {
        --hero-x: 0;
        --hero-y: 0;
        --hero-shift-x: 0px;
        --hero-shift-y: 0px;
        isolation: isolate;
      }
      @keyframes heroTitleReveal {
        from { opacity: 0; transform: translateY(-14px); filter: blur(4px); }
        to   { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      @keyframes heroActionReveal {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes heroDeityReveal {
        from { opacity: 0; transform: translateY(34px) scale(0.975); filter: blur(3px); }
        to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      @keyframes heroAuraBreathe {
        0%, 100% { opacity: 0.36; transform: translate(-50%, -50%) scale(0.96); }
        50%      { opacity: 0.54; transform: translate(-50%, -50%) scale(1.04); }
      }
      @keyframes heroButtonGleam {
        0%, 72% { transform: translateX(-145%) skewX(-18deg); opacity: 0; }
        78%     { opacity: 0.45; }
        92%, 100% { transform: translateX(165%) skewX(-18deg); opacity: 0; }
      }
      .hero-title {
        animation: heroTitleReveal 900ms 180ms cubic-bezier(0.22, 0.72, 0.28, 1) both;
      }
      .hero-actions {
        animation: heroActionReveal 800ms 760ms cubic-bezier(0.22, 0.72, 0.28, 1) both;
      }
      /* ── Hero 底部收邊 ──
         淡出距離只有這一個變數，背景那道漸層與神尊的遮罩共用它，改一個地方兩邊同步。
         桌機比手機長，因為同樣的 px 在矮畫面上占比大很多（手機 stage 才 454px 高）。 */
      :root { --hero-fade: 128px; }
      @media (max-width: 639px) { :root { --hero-fade: 88px; } }

      /* 直線漸層會看到一條「起點線」：人眼對亮度變化的**轉折**很敏感，
         線性 alpha 在頭尾各有一個折點，那兩個折點就是看起來不自然的原因。
         改用 smoothstep（3t²−2t³，兩端斜率為 0）之後起訖都糊掉了。
         中間那些看似隨便的數字就是 smoothstep 每 10% 取一個點，不要「順手改成等差」。

         ⚠ 終點色必須等於**Hero 下一個區塊的底色**，否則交界會是兩塊平色相接，
         看起來就是一條切口——曲線再順也沒用（廟方回報過，當時終點寫死米色
         #F5F0E8，而下一區的公佈欄是 bg-white）。
         下一區塊會變（公佈欄關掉時換成「關於我們」的米色），所以顏色由 App.tsx
         用 --hero-fade-rgb 傳進來，這裡只放預設值。改區塊順序或底色時要一起檢查。 */
      .hero-bottom-fade {
        --hero-fade-rgb: 255 255 255;   /* 預設＝公佈欄的 bg-white */
        height: var(--hero-fade);
        background: linear-gradient(to bottom,
          rgb(var(--hero-fade-rgb) / 0)     0%,
          rgb(var(--hero-fade-rgb) / 0.028) 10%,
          rgb(var(--hero-fade-rgb) / 0.104) 20%,
          rgb(var(--hero-fade-rgb) / 0.216) 30%,
          rgb(var(--hero-fade-rgb) / 0.352) 40%,
          rgb(var(--hero-fade-rgb) / 0.5)   50%,
          rgb(var(--hero-fade-rgb) / 0.648) 60%,
          rgb(var(--hero-fade-rgb) / 0.784) 70%,
          rgb(var(--hero-fade-rgb) / 0.896) 80%,
          rgb(var(--hero-fade-rgb) / 0.972) 90%,
          rgb(var(--hero-fade-rgb) / 1)     100%);
      }

      .hero-deity-stage {
        position: relative;
        z-index: 1;
        transform: translate3d(var(--hero-shift-x), var(--hero-shift-y), 0);
        will-change: transform;
        /* 神尊要跟背景同一種收邊。
           為什麼需要：Hero 底那道漸層是 z-auto，而這一層是 z-index:1 ——
           神尊畫在漸層「上面」，結果背景柔和淡進米白、神尊卻被硬切一刀。
           不改 z-index 而改用遮罩，是因為兩個斷點的切線不在同一個地方：
             桌機 切在 Hero 下緣（stage 下緣剛好也在那裡，負邊距把 box 收回來了）
             手機 切在 stage 自己的下緣（overflow-hidden，下面還有報名鈕）
           兩者都是「stage 的下緣」，所以一條規則就同時對得上。

           色標位置用百分比而不是 calc(100% - var(--hero-fade))：兩種都能正常運作
           （試過），選百分比是因為它跟著 stage 高度走，不必為手機再寫一組媒體查詢，
           而且「神尊溶掉多少」本來就該跟神尊自己的高度成比例。

           ⚠ 驗收這一段一定要看截圖。瀏覽器面板的截圖會有擷取競態，
           進場動畫剛跑完那幾秒可能只拍到一兩尊——那是擷取問題不是版面問題，
           連拍兩張都完整才算數。反過來也成立：DOM 全部正常不代表畫面正常，
           opacity、rect、complete 這些數字對遮罩出問題完全無感。

           81% 是「淡出長度 ÷ stage 高度」：桌機 stage 固定 86vh（98vh 高減 12vh 沉），
           19% ≈ 131px；手機 stage 454px，19% ≈ 86px——跟背景那道 128px／88px
           幾乎等長，所以兩者看起來是同一種收邊。曲線與 .hero-bottom-fade 對稱
           （同一組 smoothstep 倒過來），速率不一致的話神尊會比背景早一步消失。 */
        -webkit-mask-image: linear-gradient(to bottom,
          rgba(0,0,0,1)     81%,
          rgba(0,0,0,0.972) 82.9%,
          rgba(0,0,0,0.896) 84.8%,
          rgba(0,0,0,0.784) 86.7%,
          rgba(0,0,0,0.648) 88.6%,
          rgba(0,0,0,0.5)   90.5%,
          rgba(0,0,0,0.352) 92.4%,
          rgba(0,0,0,0.216) 94.3%,
          rgba(0,0,0,0.104) 96.2%,
          rgba(0,0,0,0.028) 98.1%,
          rgba(0,0,0,0)     100%);
        mask-image: linear-gradient(to bottom,
          rgba(0,0,0,1)     81%,
          rgba(0,0,0,0.972) 82.9%,
          rgba(0,0,0,0.896) 84.8%,
          rgba(0,0,0,0.784) 86.7%,
          rgba(0,0,0,0.648) 88.6%,
          rgba(0,0,0,0.5)   90.5%,
          rgba(0,0,0,0.352) 92.4%,
          rgba(0,0,0,0.216) 94.3%,
          rgba(0,0,0,0.104) 96.2%,
          rgba(0,0,0,0.028) 98.1%,
          rgba(0,0,0,0)     100%);
      }
      .hero-deity {
        position: relative;
        z-index: 1;
        display: block;
        opacity: 0;
        animation: heroDeityReveal 1050ms cubic-bezier(0.16, 0.76, 0.24, 1) forwards;
      }
      /* 依序由左到右浮出：1=左前濟公、2=中後三媽（主神）、3=右前二媽 */
      .hero-deity-1 { animation-delay: 240ms; }
      .hero-deity-2 { animation-delay: 420ms; }
      .hero-deity-3 { animation-delay: 560ms; }
      /* ── 首屏紋樣層（?hero=caisson，見 App.tsx 的 HeroCaisson）──
         三層都用 currentColor 上色，顏色寫在各自的 color 上，
         這樣濃淡只要調一個值，不必在 SVG 裡逐條改。 */
      .hero-pattern { pointer-events: none; }

      /* 光束：左上斜射。邊緣一定要夠軟——硬邊會變成一塊貼在牆上的三角形，
         那是當初做香煙時量過的同一個毛病。 */
      .hero-shaft {
        position: absolute;
        top: -26%;
        left: -14%;
        width: 62%;
        height: 150%;
        transform: rotate(17deg);
        transform-origin: top center;
        /* **不要用 mix-blend-mode: screen。** screen 的算式是 1-(1-a)(1-b)，
           底色越亮效果越小——金箔牆本來就亮，白色的光束疊上去實測完全看不出來。
           改成一般混色直接提亮，才真的有一道光。 */
        background: linear-gradient(to bottom,
          rgba(255, 251, 236, 0.34) 0%,
          rgba(255, 248, 224, 0.17) 36%,
          rgba(255, 244, 210, 0.06) 66%,
          transparent 88%);
        filter: blur(24px);
      }

      /* 藻井：對齊三尊的中心。桌機三尊在右側（實測中心約 71%），
         手機三尊佔滿整個寬度、中心就是 50%。
         --cy 稍微高於神尊群的中心：藻井在廟裡是在神龕「上方」的天花板。 */
      .hero-caisson {
        position: absolute;
        left: var(--caisson-x, 50%);
        top: var(--caisson-y, 50%);
        width: var(--caisson-size, min(96vw, 560px));
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        /* **金箔牆很亮，所以線條要用暗的不是亮的。**
           第一版畫成淺金色（rgba(255,246,214,.2)），在 1280px 的畫面上整片看不見——
           比背景亮的線在本來就很亮的底上沒有地方可去。改成深褐的刻痕，
           再用一道貼著下緣的亮邊做出浮雕感，那才是廟裡藻井實際的樣子。 */
        color: rgba(88, 52, 4, 0.34);
        filter: drop-shadow(0 1px 0 rgba(255, 248, 224, 0.38));
      }
      @media (min-width: 640px) and (min-aspect-ratio: 1/1) {
        .hero-caisson {
          --caisson-x: 71%;
          --caisson-y: 46%;
          --caisson-size: min(82vh, 860px);
        }
      }

      /* 海水江崖：底部的地平線。要落在 hero-bottom-fade 之上，
         不然那道往下淡出的漸層會把它整條吃掉。 */
      .hero-waves {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 9%;
        width: 100%;
        height: 13vh;
        min-height: 84px;
        color: rgba(88, 52, 4, 0.26);
        filter: drop-shadow(0 1px 0 rgba(255, 248, 224, 0.30));
      }

      /* ── 青花與泥金（?hero=qinghua，見 App.tsx 的 HeroQinghua）── */
      .hero-qinghua { pointer-events: none; }

      /* 底：靛藍紙。上緣略亮，像釉面接到光；往下收深，接得上下一段。
         色票取自 components/inkTheme.ts 的 INK，與聖母經那一頁同一套藍。 */
      .qh-ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 120% 80% at 58% 12%, rgba(86, 128, 200, 0.34) 0%, transparent 62%),
          linear-gradient(172deg, #22386B 0%, #1B2C54 42%, #16233F 72%, #0F1A2E 100%);
      }
      /* 釉光：一道很寬很淡的斜掃，瓷器的面才不是平的。
         **不要做成窄而亮的高光**——那會變成「玻璃反光」，不是釉。 */
      .qh-glaze {
        position: absolute;
        inset: -20% -10%;
        background: linear-gradient(104deg,
          transparent 18%,
          rgba(226, 240, 255, 0.07) 38%,
          rgba(226, 240, 255, 0.11) 48%,
          rgba(226, 240, 255, 0.05) 58%,
          transparent 76%);
      }
      /* 星光（廟方 2026-10-22：「hero 加一點點像聖母經的封面的一點點星光動畫」）。
         封面上其實沒有星星——那圈光是媽祖頭後的金色佛光；星光做的是把那份光
         擴散到整片夜空。
         **在 z-0 的底層，也就是神尊後面**：落在神尊身上的會被擋掉，那是對的，
         天空本來就在人後面。所以只要避開文字（導覽列與左上角的宮壇名）。
         只動 opacity 與 transform，全程合成器層級——沒有 canvas 也沒有 rAF。
         首頁的教訓已經夠多了，這一層不該再有任何執行時的運算。 */
      .qh-star {
        position: absolute;
        border-radius: 50%;
        background: rgba(240, 217, 164, .95);
        pointer-events: none;
        will-change: opacity, transform;
        animation: qh-rise linear infinite;
      }
      /* 淡入 → 上升 → 淡出，同聖母經那頁的 sp-rise（廟方 2026-10-22 指定）。
         **比 sp-rise 亮得多也撐得久**：那邊是 .5 一路掉到 .15，這邊 15% 就到
         最亮、撐到 78% 才開始收——廟方前一輪才要求「星光要再明顯一點」。
         位移用 vh 不用 px：translateY 的百分比是對自己的高度算的（才 2px），
         寫 % 等於沒動；而 hero 是 100svh，用 vh 才跟得上不同高度的螢幕。 */
      @keyframes qh-rise {
        0%   { opacity: 0;          transform: translateY(0) scale(.85); }
        15%  { opacity: var(--hi); }
        78%  { opacity: var(--lo); }
        100% { opacity: 0;          transform: translateY(calc(var(--rise) * -1)) scale(1); }
      }
      /* 減少動態效果：**不要整個凍住，改成更輕的版本。**
         第一版是 animation: none，結果開著那個設定的人看到的是一片死掉的靜止
         光點——廟方自己的電腦就開著，回報「星光要動」就是這個。
         這一層是 2px 的點、二十幾秒才移動不到一成畫面高，跟視差捲動、自動播放
         那種會引發前庭不適的動態完全不是同一個量級；該做的是「減量」不是「拿掉」。
         **只收行程、不動速度**：行程收到三分之二（6vh），秒數沿用逐顆的設定，
         所以速度也跟著降到三分之二，但每秒仍有 4~6px——看得出來在動。
         **不要收過頭**：試過 4vh / 40 秒＝每秒 0.85px、6vh / 30 秒＝每秒 1.25px，
         量出來兩個都等於沒動（要盯十秒才察覺移動了 12px），廟方連續回報兩次
         「星光要上升」就是這個。「減量」的下限是「還看得出來在動」，
         不然跟整個關掉沒有差別。
         **一定要 !important**：行程與秒數是逐顆寫在 inline style 上的，
         沒有 !important 的話這裡一條都蓋不掉（自訂屬性也吃 !important）。
         本站信眾以長者居多，開著那個設定的比例不低（CLAUDE.md 記過）。 */
      @media (prefers-reduced-motion: reduce) {
        .qh-star {
          --rise: 6vh !important;
        }
      }


      /* 泥金渲染的畫布（?hero=inkgold，見 App.tsx 的 HeroInkGold）。
         **一定要 pointer-events: none**：它鋪滿整個首屏，不關掉的話導覽列、
         登入鈕與 Hero 上的按鈕全部點不到。座標改由 window 的 pointermove 換算。
         畫布後端只有一半解析度，這裡拉回滿版——放大造成的糊正好是墨要的。 */
      .hero-ink-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        /**
         * **這道模糊是必要的，不是調味。**
         * 後端只有一半解析度，瀏覽器放大時沒有做平滑，每一個後端像素變成畫面上
         * 一塊實心方格——金色那片會出現很明顯的棋盤網格（實測放大看得一清二楚）。
         * 模糊一下方格就全消了，而且墨本來就該是糊的，等於一石二鳥。
         * 放在 CSS 不放在 canvas 裡：合成層做一次就好，不必每一筆都自己模糊。
         */
        filter: blur(5px);
      }

      /* 墨流的畫布（?hero=sumi）。整個首屏的底就是它畫的，所以不需要另外鋪漸層。
         pointer-events 一樣要關掉，否則導覽列與按鈕全部點不到。 */
      .hero-sumi-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      /* 字標組背後的暗場（?hero=lockup）。
         **這不是為了氣氛，是因為量出來讀不到。** 白字壓在金箔牆最亮的地方實測
         只有 1.45:1（全站標準 4.5:1）；左上角那個舊字標讀得到，是因為它落在
         上緣那道深色遮罩裡，而字標組垂直置中、早就離開遮罩的範圍了。
         金箔牆最亮與最暗差很多，所以「改用深色字」也不行——深字在亮處 9.6:1、
         在暗處只剩 3.9:1，兩種顏色各顧一半。鋪一層暗場把底色變成可預期的，
         才是唯一兩邊都成立的作法。
         橢圓形、而且文字整個落在最內那一段**平的**區域裡（0–42%），
         所以文字後面的 alpha 是固定的 0.50，可以直接算對比，不必逐像素猜。
         0.50 實測把 1.45:1 拉到 5.3:1。 */
      .hero-lockup { position: absolute; }
      .hero-lockup::before {
        content: '';
        position: absolute;
        z-index: -1;
        left: -2.5rem;
        right: -16rem;
        top: -14rem;
        bottom: -14rem;
        pointer-events: none;
        /* **半徑一定要小於框的一半，漸層才淡得完。**
           第一版寫 `ellipse 150% 130%`，到框的邊緣時 alpha 還有 0.37，
           於是暗場的四個邊是直的——看起來像貼了一塊深色方塊，不是暈開的光。
           垂直半徑取 50%（＝框的一半）就剛好在上下緣收乾淨；
           水平 70% 也在右緣之內。文字整個落在 0–55% 那段平的區域裡，
           所以背後的 alpha 是固定的 0.50，對比可以直接算。 */
        background: radial-gradient(ellipse 70% 50% at 22% 50%,
          rgba(0, 0, 0, 0.50) 0%,
          rgba(0, 0, 0, 0.50) 55%,
          rgba(0, 0, 0, 0.18) 80%,
          transparent 100%);
      }

      /* 次要按鈕（?hero=lockup）。主按鈕是 .btn-sutra 的磁青底泥金字，
         這一顆要能並排又不搶戲：半透明深底＋白字＋細金邊。
         **不要做成純透明只有白框**——金箔牆最亮的地方白字會糊掉，
         實測要有那層深底才過得了 4.5:1。 */
      .hero-ghost {
        background: rgba(20, 28, 48, 0.62);
        color: #ffffff;
        border: 1px solid rgba(240, 217, 164, 0.6);
        backdrop-filter: blur(2px);
      }
      .hero-ghost:hover { background: rgba(20, 28, 48, 0.74); }

      .hero-aura {
        position: absolute;
        z-index: 0;
        left: 58%;
        top: 48%;
        width: min(64vw, 720px);
        aspect-ratio: 1;
        border-radius: 999px;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255, 238, 171, 0.34) 0%, rgba(241, 190, 78, 0.12) 38%, transparent 70%);
        mix-blend-mode: screen;
        filter: blur(10px);
        animation: heroAuraBreathe 8s ease-in-out infinite;
      }
      .hero-primary {
        position: relative;
        overflow: hidden;
      }
      .hero-primary::after {
        content: '';
        position: absolute;
        inset: -40% auto -40% -35%;
        width: 24%;
        pointer-events: none;
        background: linear-gradient(90deg, transparent, rgba(255, 244, 205, 0.7), transparent);
        animation: heroButtonGleam 7.5s 2.2s ease-in-out infinite;
      }

      /* ── 絲綢反光：織錦的「翻面」隨觀看角度掃過 Hero ──
         實拍的雲龍紋緞面（使用者提供的影片）逐格比對後，關鍵不是「哪裡比較亮」，
         而是**紋樣與底子會互換明暗**：某些角度雲紋比底子暗，轉一下雲紋反而比底子亮。
         那是織錦的經緯緞面在換面——紋樣與底子用相反的緞紋織成，
         誰正對光源誰就發亮，另一個就沉下去。整片提亮／壓暗永遠做不出這件事。

         做法：把同一張底圖再放一層，套上「只翻亮度、不翻色相」的濾鏡
         （invert 會連色相一起翻成藍，再 hue-rotate(180deg) 轉回暖色系，
          最後用 sepia＋saturate 把它拉回原圖的褐金家族），
         然後用一條柔邊的橫帶遮罩決定哪一片顯示翻面版，遮罩隨角度掃過畫面。

         遮罩掛在外層、圖片放在內層做反向位移：外層平移時遮罩跟著掃，
         內層把圖釘回原位，兩張圖才會像素對齊——不然翻面帶會整個位移、露餡。
         兩層都只動 transform，瀏覽器在合成層插值，不必自己跑 rAF。

         角度由 --silk-x／--silk-y 餵進來（桌機游標、手機陀螺儀，見 components/SilkSheen.tsx）。 */
      .silk-stage {
        --silk-x: 0;          /* -1（左）… 1（右） */
        --silk-y: 0;          /* -1（上）… 1（下） */
        --silk-sweep-x: 22vw; /* 角度打滿時，翻面帶橫向掃多遠 */
        --silk-sweep-y: 26vh;
        --silk-tilt: 7deg;    /* 左右角度讓帶子傾斜多少 */
      }
      /* 手機要更明顯：翻面帶比畫面還寬，橫向平移幾乎看不出來，
         而手機最自然的動作恰好是左右轉手腕。所以窄螢幕把主力放在
         「縱向行程加大」＋「左右傾斜改成轉動帶子的角度」——
         帶子一斜，兩端就上下擺，整片布的翻面關係跟著變，這才看得出來。 */
      @media (max-width: 639px) {
        .silk-stage {
          --silk-sweep-x: 18vw;
          --silk-sweep-y: 34vh;
          --silk-tilt: 14deg;
        }
        /* 背光那一面也壓深一階，與翻面帶的落差拉開，小螢幕才看得出翻轉 */
        .silk-matte {
          -webkit-backdrop-filter: brightness(0.68) saturate(1.42);
          backdrop-filter: brightness(0.68) saturate(1.42);
        }
        /* 手機拿在手上、轉動是連續的，緩動縮短一點才跟得上手 */
        .silk-flip, .silk-flip-inner { transition-duration: 400ms; }
      }
      /* 底圖。放進元件而不是留在 App，是為了讓翻面層一定跟它同一組座標， */
      /* 兩者只要有一點對不齊，翻面帶的邊界就會出現重影。 */
      .silk-base {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .silk-flip,
      .silk-matte,
      .silk-spec {
        position: absolute;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        will-change: transform;
        transition: transform 520ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      /* 真實輸入由元件內的逐幀阻尼處理。此時再套 CSS transition 會形成雙重延遲。 */
      .silk-stage.silk-live .silk-flip,
      .silk-stage.silk-live .silk-flip-inner,
      .silk-stage.silk-live .silk-matte,
      .silk-stage.silk-live .silk-spec {
        transition: none;
      }

      /* 翻面帶：一條橫貫畫面的柔邊帶，帶內顯示明暗相反的那一面。
         平移決定帶子掃到哪，旋轉決定帶子斜多少（左右傾斜靠這個才看得出來）。 */
      .silk-flip {
        -webkit-mask-image: radial-gradient(ellipse 78% 17% at 50% 50%, #000 0%, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0.45) 66%, transparent 88%);
        mask-image: radial-gradient(ellipse 78% 17% at 50% 50%, #000 0%, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0.45) 66%, transparent 88%);
        transform: translate(calc(var(--silk-x) * var(--silk-sweep-x)), calc(var(--silk-y) * var(--silk-sweep-y)))
                   rotate(calc(var(--silk-x) * var(--silk-tilt)));
      }
      /* 內層把圖釘回舞台原位（inset:25% 於 200% 容器＝剛好等於舞台大小）。
         外層是「先轉再位移」，要抵銷就得反過來「先反位移再反轉」——
         順序寫反的話圖會被轉走，翻面帶的邊界立刻出現重影。
         兩層的 transform-origin 都落在舞台正中心，所以轉軸一致。 */
      .silk-flip-inner {
        position: absolute;
        inset: 25%;
        will-change: transform;
        transition: transform 520ms cubic-bezier(0.22, 0.61, 0.36, 1);
        transform: rotate(calc(var(--silk-x) * var(--silk-tilt) * -1))
                   translate(calc(var(--silk-x) * var(--silk-sweep-x) * -1), calc(var(--silk-y) * var(--silk-sweep-y) * -1));
      }
      .silk-flip-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        /* 只翻亮度、留在褐金色系。數值是在頁面上逐檔比對出來的：
           sepia 再低會偏灰綠、再高會糊掉；saturate 再高會變成刺眼的橘。 */
        filter: invert(1) hue-rotate(180deg) sepia(0.7) saturate(2.4) brightness(0.92);
      }

      /* 背光的那一面沉下去：壓暗加飽和，與翻面帶反向移動，一邊亮一邊沉才有翻轉感 */
      .silk-matte {
        -webkit-backdrop-filter: brightness(0.78) saturate(1.28);
        backdrop-filter: brightness(0.78) saturate(1.28);
        -webkit-mask-image: radial-gradient(ellipse 80% 26% at 50% 50%, #000 0%, rgba(0,0,0,0.6) 44%, transparent 82%);
        mask-image: radial-gradient(ellipse 80% 26% at 50% 50%, #000 0%, rgba(0,0,0,0.6) 44%, transparent 82%);
        transition-duration: 640ms;
        transform: translate(calc(var(--silk-x) * var(--silk-sweep-x) * -0.9), calc(var(--silk-y) * var(--silk-sweep-y) * -1));
      }

      /* 鏡面高光核心：騎在翻面帶上，暖心冷邊＝蠶絲的珍珠光。
         這層才適合用加法（screen），因為它模擬的是額外進入眼睛的光。 */
      .silk-spec {
        mix-blend-mode: screen;
        filter: blur(14px);
        background:
          radial-gradient(ellipse 52% 9% at 50% 48%, rgba(255,252,240,0.30) 0%, rgba(255,238,196,0.11) 52%, transparent 78%),
          radial-gradient(ellipse 60% 13% at 50% 58%, rgba(206,226,255,0.10) 0%, transparent 72%);
        transition-duration: 460ms;
        transform: translate(calc(var(--silk-x) * var(--silk-sweep-x) * 1.04), calc(var(--silk-y) * var(--silk-sweep-y) * 1.04));
      }

      /* ── 拜拜香煙的舞台 ──
         位置在 Hero 左側：宮壇名在更左上、報名鈕在左下，煙柱走在兩者之間那條空白帶，
         不會壓到字。畫布本身不吃事件。

         **層級（2026-09-26 改過，舊註解是錯的）**：神尊 z-10 → 煙（桌機 z-10、
         手機 z-25）→ 報名按鈕 z-30。舊版寫「z-10 讓煙走在神明（z-20）後面…
         而不是貼在神尊臉上」——廟方指正那是反的：爐擺在神桌前面，煙本來就從
         神像前面升上去，「這才是現實上的物理狀態」。手機因此抬到 z-25；桌機爐口
         在左側空白、本來就不重疊，維持 z-10。 */
      .incense-stage {
        position: absolute;
        z-index: 10;
        pointer-events: none;
        /* 滿版：煙的橫向位置改由元件的 CENSER_X（爐口）＋ 每縷的 base／spread 決定，
           不再靠這裡裁窄畫布。這樣同一份座標在手機與桌機都對得上同一個位置，
           也才有辦法把右邊那一爐放到神尊右側的空白。
           煙是 z-10、神尊那一層在 z-20，所以滿版也不會糊到神尊的臉。 */
        inset: 0;
      }
      @media (max-width: 639px) {
        /* 手機版把煙抬到神尊前面（廟方 2026-09-26：「手機版時，香煙動畫應該在神明前面」）。
           桌機維持 z-10 在神尊後面——那邊爐口在左側空白處，煙本來就不會經過神尊。
           斷點用 639/640，與元件裡挑選煙縷的 `r.width >= 640` 同一條線，
           免得出現「畫了桌機那幾縷、卻套手機層級」的中間狀態。
           注意神尊與「報名普渡法會」按鈕在同一個 z-20 容器裡，抬上來會一起蓋到，
           但煙在底部的濃度是淡入的（alphaAt 的 fadeIn 到 u=0.10 才滿），
           而按鈕就在最底下——實測按鈕範圍內的煙像素為 0。 */
        .incense-stage { z-index: 25; }
      }
      .incense-stage canvas { display: block; width: 100%; height: 100%; }

      /* ── 傳票列印版面（components/VoucherPrint.tsx）──
         螢幕上完全不顯示；列印時把畫面其他東西藏掉，只留這一張。
         用 visibility 而不是 display:none 來藏其他元素：display 會讓整個版面重排，
         列印時反而容易把這張表擠到奇怪的位置。 */
      .voucher-print-root { display: none; }
      @media print {
        body * { visibility: hidden; }
        .voucher-print-root, .voucher-print-root * { visibility: visible; }
        .voucher-print-root {
          display: block;
          position: absolute; left: 0; top: 0; width: 100%;
          padding: 8mm;
          font-family: "Noto Sans TC", system-ui, sans-serif;
          color: #000; background: #fff;
        }
        .vp-title { font-size: 18pt; font-weight: 700; text-align: center; margin: 0 0 6mm; letter-spacing: 2px; }
        .vp-section { font-size: 11pt; font-weight: 700; margin: 6mm 0 2mm; }
        .vp-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .vp-cell { border: 0.4mm solid #000; padding: 1.5mm 2mm; font-size: 10pt; word-break: break-all; }
        .vp-label { background: #f2f2f2; font-weight: 700; text-align: center; white-space: nowrap; }
        .vp-unit  { background: #f7f7f7; font-size: 8pt; text-align: center; white-space: nowrap; }
        /* 金額格：等寬才對得齊，一格一個數字 */
        .vp-digit { text-align: center; font-family: "Courier New", monospace; font-size: 12pt; height: 8mm; }
        .vp-num   { text-align: right; }
        .vp-check { text-align: center; white-space: nowrap; font-size: 9pt; }
        .vp-sign  { height: 14mm; }      /* 簽章與補登欄要留得下手寫 */
        .vp-note  { font-size: 9pt; margin: 2mm 0 0; }
        .vp-void  { font-size: 14pt; font-weight: 700; color: #000; text-align: center; margin: 6mm 0 0; letter-spacing: 4px; }
        @page { size: A4; margin: 8mm; }
      }

      /* ── 金箔版（tone="gold"）──
         這套原本是為織錦綢緞調的：綢緞的纖維是三稜鏡，轉個角度同一塊布會由亮翻暗，
         所以有一層「亮度反轉」的翻面帶。金箔沒有這回事——它是金屬，只有反射的強弱。
         把亮度反轉層直接疊在金黃底上，反轉後的顏色會落在橄欖綠，整片金看起來像髒了
         （實測過：關掉這一層，金才是廟方那張視覺圖的金）。
         所以金箔版只留兩件事：光帶掃過去變亮，背面稍微沉一點。 */
      .silk-gold .silk-flip { display: none; }
      .silk-gold .silk-matte {
        -webkit-backdrop-filter: brightness(0.90) saturate(1.10);
        backdrop-filter: brightness(0.90) saturate(1.10);
      }
      /* 金屬的高光比蠶絲的珍珠光更集中、更白，帶一點暖 */
      .silk-gold .silk-spec {
        filter: blur(18px);
        background:
          radial-gradient(ellipse 46% 11% at 50% 50%, rgba(255,250,225,0.42) 0%, rgba(255,232,170,0.16) 50%, transparent 78%),
          radial-gradient(ellipse 64% 18% at 50% 56%, rgba(255,244,205,0.12) 0%, transparent 74%);
      }
      @media (max-width: 639px) {
        /* 手機一樣要把背光那面壓深一階，翻面帶不在了，落差只能靠 matte 撐 */
        .silk-gold .silk-matte {
          -webkit-backdrop-filter: brightness(0.82) saturate(1.16);
          backdrop-filter: brightness(0.82) saturate(1.16);
        }
      }

      /* 待機動作：還沒收到滑鼠或陀螺儀之前，翻面帶自己緩緩游移，畫面不會是死的。
         收到第一筆真實輸入後元件會加上 .silk-live，動畫停掉、交還給使用者控制。 */
      /* 翻面帶與它的內層必須是「完全相反」的兩支動畫，差一點點圖就會位移、邊界出現重影，
         所以這兩支獨立寫死成互為反向，不跟 matte／spec 共用。 */
      @keyframes silkDriftFlip     { 0%, 100% { transform: translate(-9vw, -30vh); } 50% { transform: translate(9vw, 30vh); } }
      @keyframes silkDriftFlipBack { 0%, 100% { transform: translate(9vw, 30vh); }   50% { transform: translate(-9vw, -30vh); } }
      @keyframes silkDriftAway     { 0%, 100% { transform: translate(8vw, 26vh); }   50% { transform: translate(-8vw, -26vh); } }
      @keyframes silkDriftWith     { 0%, 100% { transform: translate(-9vw, -30vh); } 50% { transform: translate(9vw, 30vh); } }
      .silk-stage:not(.silk-live) .silk-flip       { animation: silkDriftFlip 16s ease-in-out infinite; }
      .silk-stage:not(.silk-live) .silk-flip-inner { animation: silkDriftFlipBack 16s ease-in-out infinite; }
      .silk-stage:not(.silk-live) .silk-spec       { animation: silkDriftWith 16s ease-in-out infinite; }
      .silk-stage:not(.silk-live) .silk-matte      { animation: silkDriftAway 16s ease-in-out infinite; }

      /* 使用者若在系統開啟「減少動態效果」：停掉自己會動的待機游移，
         但保留跟著滑鼠／傾斜走的反應——那是使用者自己操作出來的，
         只把行程減半、緩動放慢，避免大幅度的自動位移。 */
      @media (prefers-reduced-motion: reduce) {
        .hero-title,
        .hero-actions,
        .hero-deity,
        .hero-aura,
        .hero-primary::after { animation: none; opacity: 1; filter: none; }
        .hero-deity-stage { transform: none; }
        .silk-stage { --silk-sweep-x: 18vw; --silk-sweep-y: 26vh; --silk-tilt: 9deg; }
        .silk-stage:not(.silk-live) .silk-flip,
        .silk-stage:not(.silk-live) .silk-flip-inner,
        .silk-stage:not(.silk-live) .silk-matte,
        .silk-stage:not(.silk-live) .silk-spec { animation: none; }
        .silk-flip, .silk-flip-inner, .silk-matte, .silk-spec { transition-duration: 760ms; }
      }

      /* ── 進場與視差：沿用「天上聖母經」那一頁的手法 ──
         兩個要點讓它比一般的 fade-in 順：
         1. 觸發點抓在畫面外（桌機 1.5 倍視窗高、手機 1.15 倍），
            元素還沒進畫面就開始動，捲到時已經在半途，不會「跳出來」。
         2. 圖片除了進場，還隨捲動持續位移與縮放（視差），
            所以整頁是「一直在動」而不是「動一下就停」。
         曲線與時長刻意與聖母經頁一致，兩頁的節奏才是同一套語彙。 */
      .sr {

      .sr-left  { transform: translateX(-104px) scale(0.94); }
      .sr-right { transform: translateX(104px) scale(0.94); }
      .sr.in { opacity: 1; transform: none; }
      .sr-d1 { transition-delay: 0.10s; }
      .sr-d2 { transition-delay: 0.22s; }
      .sr-d3 { transition-delay: 0.36s; }
      /* 手機橫向位移要收斂：螢幕窄，104px 幾乎是三分之一個畫面寬，
         滑入時會先看到一段空白，反而像破圖 */
      @media (max-width: 767px) {
        .sr-left  { transform: translateX(-48px) scale(0.96); }
        .sr-right { transform: translateX(48px) scale(0.96); }
      }

      /* ── 頁面底圖：固定的祥雲裝飾層 ──
         position:fixed：內容整片往上捲、底圖幾乎不動，這個速度差是視差最強烈的形式。
         每朵雲再依自己的 depth 微幅位移，做出前後層次。
         深色底的區域（頁尾）不套用——金線在深色上會糊成一片髒污。 */
      .page-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .cloud-piece {
        position: absolute;
        height: auto;
        will-change: transform;
      }
      /* 內容要浮在底圖之上，否則會被蓋住 */
      .page-content { position: relative; z-index: 1; }

      /* 照片視差：外框與照片一起移動（不再是照片在框內飄）。
         整塊一起動比較看得出來，也不會讓人覺得照片和框「脫節」。 */
      .sr-figure { will-change: transform; }
      /* 文字欄反向微幅位移：兩層速度不同才有層次，這是視差真正的來源 */
      .sr-counter { will-change: transform; }

      /* 減少動態效果：關掉「進場」這種自動播放的動畫。
         視差不在此列——它完全由使用者的捲動驅動，捲多少動多少。 */
      @media (prefers-reduced-motion: reduce) {
        .sr { opacity: 1 !important; transform: none !important; transition: none !important; }
      }

      /* ── 影片封面的極慢推近（2026-10-30）──
         廟方拿金環太子宮比較「他們的站比較活」。對方 hero 的生命力來自**真人在動**
         （一支 9.59MB 的自動播放影片），不是特效。我們那支進香回顧是現成的，
         但**影片檔不在我們手上**（只有 YouTube id，而且是拾九影像創作拍的），
         所以這裡先用封面的緩慢推近代替——動的仍然是真實的進香畫面，不是裝飾圖形。

         要換成真的會動的影片，需要的是**原始檔**（向拾九影像創作取得授權與檔案），
         剪一段 6～10 秒無聲迴圈、自架成 webm。**不要改成自動播 YouTube iframe**：
         那等於把 facade 這支元件存在的理由整個抵銷掉（見本檔頭的說明）。

         `hover: hover` ＝ 有滑鼠的裝置。手機不跑，理由同 facade 本身：
         信眾以長者居多、網路不一定好，純裝飾的動畫不該讓他們付電跟流量。
         24 秒 alternate 是刻意的慢——快到看得出來就變成廣告看板了。 */
      @keyframes vfDrift { from { transform: scale(1); } to { transform: scale(1.06); } }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        .vf-live img { animation: vfDrift 24s ease-in-out infinite alternate; }

      /* ── 按下去要有反應（2026-10-30）──
         廟方拿金環太子宮比較時量出來的：對方首頁有 372 個元素帶轉場，我們只有 96；
         而全站的 `active:` 觸控回饋**只有 14 處**。差距主要就在這裡。
         **手機沒有 hover**，`active:` 是按下去有沒有感覺的唯一來源，
         而本站的信眾絕大多數用手機。

         分兩層，理由是「不能為了回饋把版面弄壞」：

         ① 全域這一層只動 opacity，**刻意不動 transform**。站上有好幾個
            `absolute inset-0` 的滿版按鈕（影片封面那顆就是），對它們套縮放會
            把整塊蓋圖縮掉一角；而 opacity 不參與版面計算，任何按鈕都壓不壞。
         ② 想要「壓下去」的卡片自己加 `.tap`，那一層才有縮放。

         **這不是「自動播放的動畫」，所以不跟著 prefers-reduced-motion 整個關掉**
         ——它完全由使用者按下去那一刻驅動（同 `.sr` 註解裡視差那條）。
         但縮放對敏感的人仍可能不舒服，所以 reduce 時只留 opacity。

         只在 `hover: none` 生效：有滑鼠的裝置本來就有 hover 樣式，
         再疊一層按壓只會讓點擊看起來閃一下。 */
      @media (hover: none) {
        button:active,
        a:active,
        [role="button"]:active,
        summary:active {
          opacity: .72;
        }
        /* 回彈要比按下去慢：按下的瞬間要跟手，放開才需要看得出來 */
        button, a, [role="button"], summary { transition: opacity .18s ease; }
        button:active, a:active, [role="button"]:active, summary:active { transition-duration: .04s; }

        .tap:active { transform: scale(.972); }
        .tap { transition: opacity .18s ease, transform .18s cubic-bezier(.16,1,.3,1); }
        .tap:active { transition-duration: .04s; }
      }
      @media (hover: none) and (prefers-reduced-motion: reduce) {
        .tap:active { transform: none; }
      }

      /* 標題斷行平衡。中文對句（例如「心中有善不畏苦；家有溫暖路有光。」）
         若照預設斷行，最後常掉一兩個字到第二行變成孤字；balance 會把各行字數拉平，
         剛好斷在分號處。用 class 而不是 Tailwind 任意值：本專案 CDN 版產不出部分任意值。 */
      .balance-text { text-wrap: balance; }

      /* ── Hero 行動按鈕：故宮《龍藏經》的磁青紙泥金字 ──
         Hero 底圖是滿版金色織錦，原本的金色按鈕等於埋進背景裡，再怎麼加陰影都跳不出來。
         龍藏經正好給了同一套宮廷語彙裡對比最強的解：深磁青的紙、泥金的字、
         以及每一頁都有的雙道金界欄。深藍靛壓在滿版金上，是這張底圖上唯一能一眼看到的顏色。
         界欄用兩層 inset 陰影做：先鋪一圈 3px 的磁青，再讓第 4px 的金透出來，
         就得到「離邊框 3px 的一道細金線」，比多包一層 div 乾淨。
         用 class 而不是 Tailwind 任意值：本專案的 CDN 版產不出 bg-[#…]，
         且 CDN 樣式表插在這段 <style> 之後，雙寫類名提高權重才不會被工具類蓋掉。 */
      .btn-sutra.btn-sutra {
        /* 微圓角的長方形：經頁與經板都是方的，雙金界欄配方角才像那個版面；
           圓角只留 4px 去掉刻板的銳利感，不做成藥丸。半徑寫在這裡而不是用工具類，
           一來與界欄的 inset 陰影同源好對齊，二來不必賭 CDN 版產不產得出任意值。 */
        border-radius: 4px;
        background: linear-gradient(180deg, #1F3560 0%, #16294B 55%, #101E3A 100%);
        color: #EBD293;
        border: 1px solid rgba(226, 197, 124, 0.85);
        box-shadow:
          inset 0 0 0 3px #16294B,
          inset 0 0 0 4px rgba(226, 197, 124, 0.45),
          0 10px 28px rgba(16, 30, 58, 0.45);
      }
      .btn-sutra.btn-sutra:hover {
        background: linear-gradient(180deg, #2A447A 0%, #1E3560 55%, #16294B 100%);
        color: #F7E6BC;
        box-shadow:
          inset 0 0 0 3px #1E3560,
          inset 0 0 0 4px rgba(247, 230, 188, 0.7),
          0 14px 34px rgba(16, 30, 58, 0.55);
      }

      .btn-sutra.btn-sutra:focus-visible {
        outline: 2px solid #F7E6BC;
        outline-offset: 3px;
