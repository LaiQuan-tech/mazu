<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>青花紙・泥金墨流</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #16233F; }
  body {
    font-family: 'Shippori Mincho', 'Noto Serif TC', serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* touch-action: none 是必要的——不關掉的話手機上一拖曳就變成捲動／下拉重新整理，
     墨根本推不動。 */
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  /* 底部的膠囊控制列。**寬度一定要夾住**：七個元件在 375px 的機子上會頂出畫面，
     而這一頁沒有捲動可以補救（body 是 overflow:hidden）。 */
  #bar {
    position: fixed;
    left: 50%;
    bottom: max(1rem, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.65rem;
    max-width: calc(100vw - 1.5rem);
    border-radius: 999px;
    background: rgba(12, 20, 38, 0.52);
    border: 1px solid rgba(201, 168, 106, 0.26);
    box-shadow: 0 6px 26px rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    user-select: none;
  }
  .sw {
    width: 26px; height: 26px; flex: 0 0 auto;
    border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255, 248, 224, 0.22);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .sw[aria-pressed="true"] {
    transform: scale(1.16);
    box-shadow: 0 0 0 2px rgba(12, 20, 38, .9), 0 0 0 3.5px rgba(240, 217, 164, .75);
  }
  .sep { width: 1px; height: 20px; background: rgba(201, 168, 106, 0.28); flex: 0 0 auto; }
  .tb {
    flex: 0 0 auto; cursor: pointer; border: 1px solid rgba(201, 168, 106, 0.32);
    background: transparent; color: rgba(240, 217, 164, 0.88);
    font: inherit; font-size: 12px; letter-spacing: .06em;
    padding: 0.38rem 0.7rem; border-radius: 999px; white-space: nowrap;
    transition: background .18s ease, color .18s ease;
  }
  .tb[aria-pressed="true"] { background: rgba(240, 217, 164, 0.88); color: #16233F; border-color: transparent; }
  .tb:hover { background: rgba(240, 217, 164, 0.16); }
  .tb[aria-pressed="true"]:hover { background: rgba(240, 217, 164, 0.96); }
  @media (max-width: 420px) {
    #bar { gap: 0.35rem; padding: 0.45rem 0.5rem; }
    .sw { width: 22px; height: 22px; }
    .tb { font-size: 11px; padding: 0.34rem 0.52rem; }
  }
  #fail {
    position: fixed; inset: 0; display: none; place-items: center;
    background: #16233F; color: rgba(240, 217, 164, .6); font-size: 13px; letter-spacing: .08em;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="fail">這個瀏覽器不支援 WebGL</div>

<div id="bar" role="toolbar" aria-label="操作">
  <button class="tb" id="wash">洗い流す</button>
</div>

<script type="x-shader/x-vertex" id="vs">#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
uniform vec2 uTexel;
void main () {
  vUv = aPos * 0.5 + 0.5;
  vL = vUv - vec2(uTexel.x, 0.0);
  vR = vUv + vec2(uTexel.x, 0.0);
  vT = vUv + vec2(0.0, uTexel.y);
  vB = vUv - vec2(0.0, uTexel.y);
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<script>
/**
 * 青花紙・泥金墨流
 *
 * 墨流し（suminagashi）：墨**浮在水面上被推著跑**，不是滲進紙裡——所以必須真的
 * 算一個速度場（Stable Fluids），不是把一堆半透明的圓疊上去。每一幀：
 *   curl → vorticity（渦度補強）→ divergence → pressure（Jacobi ×20）
 *   → gradientSubtract → advect velocity → advect dye → display
 *
 * 底是青花紙（靛藍），墨是泥金。這個組合有個名字叫**紺紙金泥**，
 * 寫經用了一千多年，所以四個墨色就照那一套走：泥金、銀泥、赤金、青金。
 *
 * ── 畫質的三個關鍵（上一版就是栽在這裡，廟方回報「顆粒感很重」）──
 *
 * 1. **dye 的解析度不能低。** 上一版 320 放到 1920 的畫布是六倍放大，
 *    再怎麼平滑都是一格一格。這一版 dye 跟著螢幕走、上限 1024。
 *
 * 2. **一定要 LINEAR。** 上一版用 `OES_texture_float_linear` 在不在來決定
 *    LINEAR 還是 NEAREST——**那個判斷本身是錯的**：那個擴充講的是 32 位元浮點，
 *    而 half-float 的線性取樣在 WebGL2 裡是核心功能，本來就有。
 *    判斷失誤退到 NEAREST，整片墨就變成馬賽克。
 *
 * 3. **金泥不能用「吸收」去算。** 深色紙上的金**比紙亮**，是顏料蓋上去不是染進去，
 *    Beer–Lambert（紙 × exp(-吸收)）那一套只對「深墨壓淺紙」成立，
 *    拿來畫金泥會越疊越黑。這裡 dye 存的是**預乘的顏色＋覆蓋量**
 *    （rgb = 顏色×量、a = 量），顯示時 `mix(紙, 顏色, 1-exp(-量))`——
 *    疊起來的地方顏色會自己平均（金壓銀變成中間色），濃度則飽和不爆掉。
 */
(function () {
  'use strict';

  var canvas = document.getElementById('stage');
  var gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false });
  if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
    document.getElementById('fail').style.display = 'grid';
    canvas.style.display = 'none';
    document.getElementById('bar').style.display = 'none';
    return;
  }

  var HEAD = '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\nin vec2 vUv;in vec2 vL;in vec2 vR;in vec2 vT;in vec2 vB;out vec4 oColor;\n';

  var F_SPLAT_VEL = HEAD + [
    'uniform sampler2D uTarget;uniform float uAspect;uniform vec2 uPoint;uniform vec2 uForce;uniform float uRadius;',
    'void main(){',
    '  vec2 p=vUv-uPoint; p.x*=uAspect;',
    '  oColor=vec4(texture(uTarget,vUv).xy+exp(-dot(p,p)/uRadius)*uForce,0.,1.);',
    '}'].join('\n');

  /**
   * 下墨。`uRing>0.5` 時打的是**環**不是團——那是墨流し的招牌：
   * 真的做法是墨與分散劑交替滴在水面，推開成一圈一圈的同心環。
   * 點擊用環，拖曳用團（連續的筆觸）。
   * uInk 是預乘過的（rgb=顏色×量、a=量），理由見檔頭第 3 點。
   */
  var F_SPLAT_DYE = HEAD + [
    'uniform sampler2D uTarget;uniform float uAspect;uniform vec2 uPoint;uniform vec4 uInk;',
    'uniform float uRadius;uniform float uInner;uniform float uRing;',
    'void main(){',
    '  vec2 p=vUv-uPoint; p.x*=uAspect; float d=length(p);',
    '  float g=exp(-dot(p,p)/uRadius);',
    '  float r=exp(-((d-uInner)*(d-uInner))/uRadius);',
    '  oColor=texture(uTarget,vUv)+uInk*mix(g,r,step(0.5,uRing));',
    '}'].join('\n');

  var F_ADVECT = HEAD + [
    'uniform sampler2D uVelocity;uniform sampler2D uSource;uniform vec2 uTexelSim;',
    'uniform float uDt;uniform float uDissipation;',
    'void main(){',
    '  vec2 coord=vUv-uDt*texture(uVelocity,vUv).xy*uTexelSim;',
    '  oColor=texture(uSource,coord)/(1.0+uDissipation*uDt);',
    '}'].join('\n');

  var F_DIVERGENCE = HEAD + [
    'uniform sampler2D uVelocity;',
    'void main(){',
    '  float l=texture(uVelocity,vL).x,r=texture(uVelocity,vR).x;',
    '  float t=texture(uVelocity,vT).y,b=texture(uVelocity,vB).y;',
    '  vec2 c=texture(uVelocity,vUv).xy;',
    // 邊界當牆：不這樣做墨會從邊緣流掉，整片慢慢變平
    '  if(vL.x<0.0)l=-c.x; if(vR.x>1.0)r=-c.x; if(vT.y>1.0)t=-c.y; if(vB.y<0.0)b=-c.y;',
    '  oColor=vec4(0.5*(r-l+t-b),0.,0.,1.);',
    '}'].join('\n');

  var F_CURL = HEAD + [
    'uniform sampler2D uVelocity;',
    'void main(){',
    '  float l=texture(uVelocity,vL).y,r=texture(uVelocity,vR).y;',
    '  float t=texture(uVelocity,vT).x,b=texture(uVelocity,vB).x;',
    '  oColor=vec4(0.5*(r-l-t+b),0.,0.,1.);',
    '}'].join('\n');

  var F_VORTICITY = HEAD + [
    'uniform sampler2D uVelocity;uniform sampler2D uCurl;uniform float uCurlAmount;uniform float uDt;',
    'void main(){',
    '  float l=texture(uCurl,vL).x,r=texture(uCurl,vR).x;',
    '  float t=texture(uCurl,vT).x,b=texture(uCurl,vB).x,c=texture(uCurl,vUv).x;',
    '  vec2 f=0.5*vec2(abs(t)-abs(b),abs(r)-abs(l));',
    '  f/=length(f)+0.0001; f*=uCurlAmount*c; f.y*=-1.0;',
    '  oColor=vec4(clamp(texture(uVelocity,vUv).xy+f*uDt,-1200.,1200.),0.,1.);',
    '}'].join('\n');

  var F_PRESSURE = HEAD + [
    'uniform sampler2D uPressure;uniform sampler2D uDivergence;',
    'void main(){',
    '  float l=texture(uPressure,vL).x,r=texture(uPressure,vR).x;',
    '  float t=texture(uPressure,vT).x,b=texture(uPressure,vB).x;',
    '  oColor=vec4((l+r+b+t-texture(uDivergence,vUv).x)*0.25,0.,0.,1.);',
    '}'].join('\n');

  var F_GRADIENT = HEAD + [
    'uniform sampler2D uPressure;uniform sampler2D uVelocity;',
    'void main(){',
    '  float l=texture(uPressure,vL).x,r=texture(uPressure,vR).x;',
    '  float t=texture(uPressure,vT).x,b=texture(uPressure,vB).x;',
    '  oColor=vec4(texture(uVelocity,vUv).xy-vec2(r-l,t-b),0.,1.);',
    '}'].join('\n');

  /**
   * 青花紙 ＋ 泥金。
   * 紙是程序生成的：靛藍底、纖維、細顆粒、很淡的邊緣暗角，一張圖都不用。
   * **深色紙上的纖維是「比底亮」的**，與淺色紙相反——照淺紙那樣寫（乘小於一）
   * 會讓纖維變成一條條黑痕，看起來是髒不是紙。
   */
  var F_DISPLAY = HEAD + [
    'uniform sampler2D uDye;uniform vec2 uRes;',
    // 不用 sin(dot(p,...)) 當雜湊：顆粒那層的輸入是 floor(vUv*uRes)，在 2560 寬的
    // 畫布上 dot 會到八十幾萬，而 GLSL 對這麼大的角度不保證精度，不同驅動結果不一樣。
    // 這個版本全程留在 [0,1)，多大的座標都穩定。
    // （整片變黑那次不是它造成的，是 dye 的 alpha 被清成 1，見 fbo() 裡的說明。）
    'float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }',
    'float vnoise(vec2 p){',
    '  vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);',
    '}',
    'void main(){',
    '  vec3 base=mix(vec3(0.059,0.098,0.180),vec3(0.125,0.200,0.361),smoothstep(0.0,1.0,vUv.y));',
    // 纖維：兩個方向都拉長，交錯起來才像手漉的紙
    '  float f1=vnoise(vec2(vUv.x*180.0,vUv.y*1400.0));',
    '  float f2=vnoise(vec2(vUv.x*1500.0,vUv.y*140.0));',
    '  float f3=vnoise(vUv*vec2(60.0,52.0));',
    '  base*=1.0+0.13*(f1-0.5)+0.10*(f2-0.5)+0.09*(f3-0.5);',
    // 細顆粒：按實際像素取樣，縮放時密度才不會變
    '  base*=1.0+0.040*(hash(floor(vUv*uRes))-0.5);',
    // 很淡的邊緣暗角
    '  float v=length((vUv-0.5)*vec2(1.0,0.86));',
    '  base*=1.0-0.30*smoothstep(0.30,0.85,v);',
    '  vec4 d=texture(uDye,vUv);',
    '  float amt=max(d.a,0.0);',
    // 預乘還原成顏色；量太小時除法會爆掉，所以要擋
    '  vec3 tint=amt>0.0008?clamp(d.rgb/amt,0.0,1.6):vec3(0.769,0.596,0.125);',
    // 金泥也吃纖維：紙上有纖維的地方沾得多一點，邊緣才會毛
    '  float cover=1.0-exp(-amt*3.0*(1.0+0.30*(f1+f2-1.0)));',
    '  vec3 col=mix(base,tint,clamp(cover,0.0,1.0));',
    // 金屬一點點反光：濃的地方再提一咪咪，不然是平的色塊不是泥金
    '  col+=tint*0.10*smoothstep(0.55,1.0,cover);',
    '  oColor=vec4(col,1.0);',
    '}'].join('\n');

  // ── 編譯 ────────────────────────────────────────────────────
  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s), src); return null; }
    return s;
  }
  var vs = sh(gl.VERTEX_SHADER, document.getElementById('vs').textContent.trim());
  function prog(fsrc) {
    var f = sh(gl.FRAGMENT_SHADER, fsrc), p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, f); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < n; i++) { var info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return { p: p, u: u };
  }
  var P = {
    splatVel: prog(F_SPLAT_VEL), splatDye: prog(F_SPLAT_DYE), advect: prog(F_ADVECT),
    divergence: prog(F_DIVERGENCE), curl: prog(F_CURL), vorticity: prog(F_VORTICITY),
    pressure: prog(F_PRESSURE), gradient: prog(F_GRADIENT), display: prog(F_DISPLAY)
  };

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // ── FBO ─────────────────────────────────────────────────────
  var owned = [];
  function fbo(w, h, internal, format) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    // **一律 LINEAR**（理由見檔頭第 2 點）
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, gl.HALF_FLOAT, null);
    var f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    // **alpha 一定要清成 0。** dye 的 a 存的是墨量（預乘模型），清成 1 等於整張紙
    // 一開始就「被墨蓋滿」，而 rgb 是 0，還原出來的顏色就是黑的——畫面整片漆黑、
    // 只有真的下過墨的地方看得到顏色。上一版 dye 只用 rgb、不看 a，所以沒踩到。
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    owned.push([tex, f]);
    return { tex: tex, fbo: f, w: w, h: h };
  }
  function dbl(w, h, internal, format) {
    var a = fbo(w, h, internal, format), b = fbo(w, h, internal, format);
    return { get read() { return a; }, get write() { return b; }, swap: function () { var t = a; a = b; b = t; } };
  }
  function release() { owned.forEach(function (o) { gl.deleteTexture(o[0]); gl.deleteFramebuffer(o[1]); }); owned = []; }

  var SIM = 256;
  var velocity, dye, divergenceF, curlF, pressure, aspect = 1, gw = 0, gh = 0;

  function allocate() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = Math.max(1, Math.round(innerWidth * dpr));
    var H = Math.max(1, Math.round(innerHeight * dpr));
    canvas.width = W; canvas.height = H;
    aspect = Math.max(0.2, W / H);
    var sw = aspect >= 1 ? Math.round(SIM * aspect) : SIM;
    var shh = aspect >= 1 ? SIM : Math.round(SIM / aspect);
    // dye 跟著螢幕走，上限 1024（再高只是燒效能，看不出差別）
    var dyeLong = Math.min(1024, Math.max(640, Math.round(Math.max(W, H) * 0.75)));
    var dw = aspect >= 1 ? dyeLong : Math.round(dyeLong * aspect);
    var dh = aspect >= 1 ? Math.round(dyeLong / aspect) : dyeLong;
    // 格子沒變就不要重配——重配等於把水面清空，畫到一半的墨會憑空消失
    if (sw === gw && shh === gh) return;
    gw = sw; gh = shh;
    release();
    velocity = dbl(sw, shh, gl.RG16F, gl.RG);
    dye = dbl(dw, dh, gl.RGBA16F, gl.RGBA);
    divergenceF = fbo(sw, shh, gl.R16F, gl.RED);
    curlF = fbo(sw, shh, gl.R16F, gl.RED);
    pressure = dbl(sw, shh, gl.R16F, gl.RED);
  }
  allocate();

  function blit(t) {
    if (t) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); gl.viewport(0, 0, t.w, t.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height); }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function bind(i, tex) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex); }
  function use(q, w, h) { gl.useProgram(q.p); if (q.u.uTexel) gl.uniform2f(q.u.uTexel, 1 / w, 1 / h); return q.u; }

  /**
   * 只有一個金色（廟方 2026-10-20：「要金色，其他顏色都不要」）。
   * 用的是**和聖壇官網自己的金**：`temple-gold` #C49820（tailwind.config.cjs，
   * CLAUDE.md 的「主色」那條也記著）。不要另外調一個比較亮的金——
   * 這一頁最後要接回首頁，色票不一致的話兩邊就對不起來了。
   */
  var INK = [196 / 255, 152 / 255, 32 / 255];

  function splat(x, y, fx, fy, amount, ring, inner) {
    var v = velocity.read, u = use(P.splatVel, v.w, v.h);
    bind(0, v.tex);
    gl.uniform1i(u.uTarget, 0); gl.uniform1f(u.uAspect, aspect);
    gl.uniform2f(u.uPoint, x, y); gl.uniform2f(u.uForce, fx, fy);
    gl.uniform1f(u.uRadius, 0.0012);
    blit(velocity.write); velocity.swap();

    if (amount <= 0) return;
    var d = dye.read; u = use(P.splatDye, d.w, d.h);
    bind(0, d.tex);
    var c = INK;
    gl.uniform1i(u.uTarget, 0); gl.uniform1f(u.uAspect, aspect);
    gl.uniform2f(u.uPoint, x, y);
    // 預乘：rgb = 顏色×量、a = 量
    gl.uniform4f(u.uInk, c[0] * amount, c[1] * amount, c[2] * amount, amount);
    gl.uniform1f(u.uRadius, ring ? 0.00022 : 0.00060);
    gl.uniform1f(u.uInner, inner !== undefined ? inner : 0.020 + Math.random() * 0.045);
    gl.uniform1f(u.uRing, ring ? 1 : 0);
    blit(dye.write); dye.swap();
  }

  // ── 一幀 ────────────────────────────────────────────────────
  var DT = 0.016;
  var washUntil = 0;
  function step() {
    var v = velocity.read, u;
    u = use(P.curl, v.w, v.h); bind(0, v.tex); gl.uniform1i(u.uVelocity, 0); blit(curlF);

    u = use(P.vorticity, v.w, v.h);
    bind(0, velocity.read.tex); bind(1, curlF.tex);
    gl.uniform1i(u.uVelocity, 0); gl.uniform1i(u.uCurl, 1);
    gl.uniform1f(u.uCurlAmount, 30); gl.uniform1f(u.uDt, DT);
    blit(velocity.write); velocity.swap();

    u = use(P.divergence, v.w, v.h);
    bind(0, velocity.read.tex); gl.uniform1i(u.uVelocity, 0); blit(divergenceF);

    // 壓力場不清零：上一幀的解是這一幀很好的起點，疊代次數可以省一半
    for (var i = 0; i < 20; i++) {
      u = use(P.pressure, v.w, v.h);
      bind(0, pressure.read.tex); bind(1, divergenceF.tex);
      gl.uniform1i(u.uPressure, 0); gl.uniform1i(u.uDivergence, 1);
      blit(pressure.write); pressure.swap();
    }

    u = use(P.gradient, v.w, v.h);
    bind(0, pressure.read.tex); bind(1, velocity.read.tex);
    gl.uniform1i(u.uPressure, 0); gl.uniform1i(u.uVelocity, 1);
    blit(velocity.write); velocity.swap();

    u = use(P.advect, v.w, v.h);
    bind(0, velocity.read.tex);
    gl.uniform1i(u.uVelocity, 0); gl.uniform1i(u.uSource, 0);
    gl.uniform2f(u.uTexelSim, 1 / v.w, 1 / v.h);
    gl.uniform1f(u.uDt, DT); gl.uniform1f(u.uDissipation, 0.20);
    blit(velocity.write); velocity.swap();

    var d = dye.read;
    u = use(P.advect, d.w, d.h);
    bind(0, velocity.read.tex); bind(1, d.tex);
    gl.uniform1i(u.uVelocity, 0); gl.uniform1i(u.uSource, 1);
    gl.uniform2f(u.uTexelSim, 1 / v.w, 1 / v.h);
    gl.uniform1f(u.uDt, DT);
    // 平常幾乎不退：墨流的紋路是留在水面上的。按了「洗い流す」才大幅拉高。
    gl.uniform1f(u.uDissipation, performance.now() < washUntil ? 1.6 : 0.008);
    blit(dye.write); dye.swap();

    u = use(P.display, canvas.width, canvas.height);
    bind(0, dye.read.tex);
    gl.uniform1i(u.uDye, 0);
    gl.uniform2f(u.uRes, canvas.width, canvas.height);
    blit(null);
  }

  // ── 互動 ────────────────────────────────────────────────────
  var down = false, px = 0, py = 0, hasPrev = false;
  function toUv(e) {
    var r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  }
  /**
   * **只有滑鼠在動的時候才有東西發生**（廟方 2026-10-20：「不要用滴的，
   * 要有滑鼠才會有動畫」）。所以：
   *   沒有點擊下墨——`pointermove` 本身就是輸入，不必按著。
   *   沒有自動演出——沒人動滑鼠畫面就是靜的。
   *   迴圈也跟著停：最後一次移動之後讓水流自己收幾秒就不再排程 rAF，
   *   不是永遠掛著一個空轉的模擬。
   */
  var px = 0, py = 0, hasPrev = false, sinceRing = 0;

  function toUv(e) {
    var r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  }

  window.addEventListener('pointermove', function (e) {
    var p = toUv(e), x = p[0], y = p[1];
    if (x < 0 || x > 1 || y < 0 || y > 1) { hasPrev = false; return; }
    // 力道要夾住：滑鼠突然跳很遠（切視窗回來）會一下把水攪散
    var fx = hasPrev ? Math.max(-70, Math.min(70, (x - px) * 5200)) : 0;
    var fy = hasPrev ? Math.max(-70, Math.min(70, (y - py) * 5200)) : 0;
    var moved = Math.hypot(fx, fy);
    px = x; py = y; hasPrev = true;
    if (moved < 0.8) return;

    /**
     * 連續的筆觸用團，**每隔一小段才補一圈同心環**。
     * 全部用團的話只是一條金色的帶子；而環是墨流し的招牌——
     * 它會被水流拉開成大理石紋，那個紋路才是這個效果的重點。
     */
    splat(x, y, fx, fy, Math.min(0.15, 0.026 + moved * 0.0034), false);
    // 環不能太密也不能太濃：每六筆補一組、濃度跟筆觸差不多時，整條會變成一串
    // 疙瘩像麻花，而不是一道被攪開的墨。拉長間隔、壓低濃度，環才是「藏在流裡」的。
    if (++sinceRing >= 11) {
      sinceRing = 0;
      var base = 0.016 + Math.random() * 0.010;
      for (var i = 0; i < 2; i++) splat(x, y, 0, 0, 0.26 - i * 0.10, true, base * (1 + i * 1.8));
    }
    wake(3600);
  }, { passive: true });

  var raf = 0, liveUntil = 0;
  function frame() {
    raf = 0;
    step();
    if (performance.now() < liveUntil && !document.hidden) raf = requestAnimationFrame(frame);
  }
  function wake(ms) {
    liveUntil = Math.max(liveUntil, performance.now() + ms);
    if (!raf && !document.hidden) raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
  });
  step();          // 先畫一次紙，不然進來是一片黑

  // ── 控制列 ───────────────────────────────────────────────────
  document.getElementById('wash').addEventListener('click', function () {
    washUntil = performance.now() + 2600;   // 慢慢淡掉，不是一下清空
    wake(3000);                             // 要讓迴圈跑起來才淡得掉
  });

  addEventListener('resize', allocate);
  addEventListener('orientationchange', function () { setTimeout(allocate, 120); });
})();
</script>
</body>
</html>
